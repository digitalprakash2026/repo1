<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>All Tractors</title><link rel='stylesheet' href='styles.css'></head><body><main class='container'><h1>All Kubota Tractor Models</h1><p>Filter models by name/use case for faster selection.</p><input id='q' placeholder='Search model or use case'><div id='models' class='grid g3' style='margin-top:1rem'></div></main><script src='data.js'></script><script src='script.js'></script><script>renderShell('tractors.html');const box=document.getElementById('models');function draw(v=''){box.innerHTML=MODELS.filter(m=>(m.name+m.usage).toLowerCase().includes(v.toLowerCase())).map(m=>`<article class='card'><img src='${m.img}' alt='${m.name}'><h3>${m.name}</h3><p>${m.hp} • ${m.engine}</p><p>${m.usage}</p><div class='row'><a class='btn btn-outline' href='tractor-${m.slug}.html'>View Details</a><a class='btn btn-primary' href='https://wa.me/${CONTACT.whatsapp}?text=Interested in ${encodeURIComponent(m.name)}' target='_blank'>WhatsApp Inquiry</a></div></article>`).join('')}draw();document.getElementById('q').oninput=e=>draw(e.target.value)</script></body></html>
